name: SecureVisit staging smoke

on:
  workflow_dispatch:
  schedule:
    # Keep public staging reachability observable between releases. Manual
    # dispatch additionally runs the authenticated readiness gate below.
    - cron: "*/15 * * * *"

permissions:
  contents: read

jobs:
  smoke:
    name: Check deployed staging contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: staging
    env:
      STAGING_DOMAIN: ${{ secrets.STAGING_DOMAIN }}
      STAGING_READINESS_COOKIE: ${{ secrets.STAGING_READINESS_COOKIE }}
      STAGING_SMOKE_REQUIRE_READINESS: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
      STAGING_SMOKE_ALLOW_INSECURE: "false"
      STAGING_SMOKE_TIMEOUT_MS: "10000"
      STAGING_SMOKE_EVIDENCE_PATH: evidence/staging-smoke-${{ github.run_id }}.json
      SECUREVISIT_RELEASE_EVIDENCE_ID: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run staging smoke
        run: npm run staging:smoke

      - name: Upload staging smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: securevisit-staging-smoke-${{ github.run_id }}
          path: evidence/staging-smoke-${{ github.run_id }}.json
          if-no-files-found: error
          retention-days: 30
