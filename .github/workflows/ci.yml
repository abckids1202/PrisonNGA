name: SecureVisit CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Validate Vercel to Worker boundary
        env:
          SECUREVISIT_VERCEL_DEPLOYMENT: "true"
          PUBLIC_APP_URL: https://securevisit-staging.example.invalid
          WORKER_API_ORIGIN: https://securevisit-api-staging.example.invalid
        run: npm run vercel-build

      # Keep hosted CI on the same authoritative release verifier used before
      # every local push. This includes whitespace, migrations, backup/restore,
      # typecheck, lint, build/server tests, browser tests, and dependency
      # audit, instead of maintaining a second subtly different checklist.
      - name: Verify release baseline
        run: npm run verify:release
